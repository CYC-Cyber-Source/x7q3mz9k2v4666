<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#fff4f7" />
  <meta name="description" content="x7Q3_mZ9K2_v4" />
  <meta property="og:title" content="x7Q3_mZ9K2_v4" />
  <meta property="og:description" content="··· ୨୧ ···" />
  <meta property="og:type" content="website" />
  <title>x7Q3_mZ9K2_v4</title>
  <style>
    :root { --pink:#ef6c8f; --deep:#cf3f68; --ink:#6b3445; --paper:#fffaf9; }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body { margin:0; min-height:100%; }
    body {
      min-height:100svh; overflow:hidden; color:var(--ink);
      font-family:"STKaiti","KaiTi","Songti SC",serif;
      background:
        radial-gradient(circle at 18% 16%, rgba(255,255,255,.95) 0 7%, transparent 26%),
        radial-gradient(circle at 85% 78%, rgba(255,214,225,.8), transparent 32%),
        linear-gradient(145deg,#fff9f5 0%,#ffe9ef 52%,#ffd8e5 100%);
    }
    body.revealed { overflow-x:hidden; overflow-y:auto; }
    main { position:relative; min-height:100svh; display:grid; place-items:center; padding:28px; isolation:isolate; overflow:hidden; }
    .glow { position:absolute; inset:0; background:radial-gradient(circle at 50% 48%,rgba(255,255,255,.85),transparent 42%); z-index:-2; }
    .symbols {
      border:0; background:rgba(255,255,255,.58); color:#c86080; cursor:pointer;
      width:min(88vw,360px); min-height:190px; border-radius:28px; padding:26px 22px;
      box-shadow:0 18px 55px rgba(169,64,97,.16), inset 0 0 0 1px rgba(255,255,255,.9);
      backdrop-filter:blur(12px); -webkit-backdrop-filter:blur(12px);
      font:500 23px/1.85 ui-rounded,"SF Pro Rounded",system-ui,sans-serif;
      letter-spacing:7px; transition:transform .25s ease, opacity .45s ease;
      animation:float 2.8s ease-in-out infinite;
    }
    .symbols:active { transform:scale(.97); }
    .hint { display:block; margin-top:15px; color:#a87080; font:14px/1.5 system-ui,sans-serif; letter-spacing:2px; }
    .message { position:absolute; inset:0; display:grid; place-items:center; padding:28px; pointer-events:none; opacity:0; }
    .card { width:min(88vw,410px); text-align:center; transform:scale(.72) translateY(18px); }
    .eyebrow { margin:0 0 19px; font:13px/1.4 system-ui,sans-serif; letter-spacing:5px; color:#b7788c; }
    h1 { margin:0; font-size:clamp(34px,10vw,56px); line-height:1.35; font-weight:700; text-shadow:0 5px 18px rgba(255,255,255,.95); }
    h1 span { display:block; }
    .love { margin-top:12px; color:var(--deep); }
    .emoji { margin:22px 0 0; font:30px/1.55 system-ui,sans-serif; letter-spacing:5px; }
    .forever { margin-top:22px; font-size:15px; letter-spacing:4px; color:#9e6678; opacity:0; }
    .scroll-cue { position:absolute; bottom:calc(20px + env(safe-area-inset-bottom)); left:0; right:0; margin:0; text-align:center; color:#a66c80; font:13px/1.5 system-ui,sans-serif; letter-spacing:2px; opacity:0; pointer-events:none; }
    .revealed .symbols { opacity:0; transform:scale(.7); animation:none; pointer-events:none; }
    .revealed .message { opacity:1; }
    .revealed .card { animation:reveal .9s cubic-bezier(.2,.85,.28,1.15) forwards; }
    .revealed .forever { animation:fadeUp .7s 1.05s ease forwards; }
    .revealed .scroll-cue { animation:fadeUp .7s 1.8s ease forwards; }
    .gallery { display:none; position:relative; padding:48px 20px max(72px,env(safe-area-inset-bottom)); text-align:center; }
    body.revealed .gallery { display:block; animation:fadeUp .7s 1.2s both; }
    .gallery h2 { margin:0 auto 26px; color:#a35974; font-size:clamp(18px,5vw,24px); font-weight:500; letter-spacing:3px; }
    .photos { max-width:800px; margin:auto; display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:20px; align-items:start; }
    .photos figure { margin:0; padding:9px 9px 19px; border-radius:22px; background:rgba(255,255,255,.85); box-shadow:0 16px 45px rgba(169,64,97,.17); transform:rotate(-2deg); }
    .photos figure:nth-child(2) { transform:rotate(2deg); }
    .photos img { width:100%; height:auto; aspect-ratio:1279/1706; display:block; object-fit:cover; border-radius:15px; }
    @media (max-width:600px) { .photos { max-width:400px; grid-template-columns:1fr; gap:28px; } .gallery { padding-top:40px; } }
    .heart { position:absolute; bottom:-45px; z-index:-1; opacity:0; user-select:none; pointer-events:none; animation:rise var(--d) var(--delay) ease-in forwards; }
    @keyframes float { 50% { transform:translateY(-8px); } }
    @keyframes reveal { to { transform:scale(1) translateY(0); } }
    @keyframes fadeUp { to { opacity:1; transform:translateY(-5px); } }
    @keyframes rise { 0%{opacity:0;transform:translate3d(0,0,0) rotate(0)} 15%{opacity:.85} 100%{opacity:0;transform:translate3d(var(--x),-115svh,0) rotate(var(--r))} }
    @media (prefers-reduced-motion:reduce) { *,*::before,*::after { animation-duration:.01ms!important; animation-delay:0ms!important; } }
  </style>
</head>
<body>
  <main id="scene">
    <div class="glow"></div>
    <button class="symbols" id="open" aria-label="打开这封小情书">
      ♡ ✦ ୨୧ 𓂃 ࣪˖ ִֶָ𐀔<br>⋆｡°✩ 💌 ✩°｡⋆<br>₊˚⊹♡ ʚɞ ♡⊹˚₊
      <span class="hint">轻轻点一下 · 有句话想告诉你</span>
    </button>
    <section class="message" aria-live="polite">
      <div class="card">
        <p class="eyebrow">TO MY FAVORITE PERSON</p>
        <h1><span>陈柔娜</span><span class="love">我好爱你</span></h1>
        <p class="emoji">💕 😘😘😘<br>💕💕💕 💗💗</p>
        <p class="forever">今天爱你，明天也爱你</p>
      </div>
    </section>
    <p class="scroll-cue">↓ 还有两张照片想给你看</p>
  </main>
  <section class="gallery" aria-label="两张珍藏的照片">
    <h2>把喜欢的瞬间，也放在这里 ♡</h2>
    <div class="photos">
      <figure><img src="assets/portrait-1.jpg" width="1279" height="1706" alt="她的第一张照片" loading="lazy" decoding="async"></figure>
      <figure><img src="assets/portrait-2.jpg" width="1279" height="1706" alt="她的第二张照片" loading="lazy" decoding="async"></figure>
    </div>
  </section>
  <script>
    const scene = document.querySelector('#scene');
    document.querySelector('#open').addEventListener('click', () => {
      if (scene.classList.contains('revealed')) return;
      scene.classList.add('revealed');
      document.body.classList.add('revealed');
      const icons = ['♡','♥','💕','💗','✦'];
      for (let i=0;i<34;i++) {
        const h=document.createElement('span'); h.className='heart';
        h.textContent=icons[Math.floor(Math.random()*icons.length)];
        h.style.left=(Math.random()*100)+'%';
        h.style.fontSize=(14+Math.random()*22)+'px';
        h.style.setProperty('--x',(-70+Math.random()*140)+'px');
        h.style.setProperty('--r',(-80+Math.random()*160)+'deg');
        h.style.setProperty('--d',(4.4+Math.random()*3.2)+'s');
        h.style.setProperty('--delay',(Math.random()*2.2)+'s');
        scene.appendChild(h);
      }
    });
  </script>
</body>
</html>
